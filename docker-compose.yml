services:
  movie-db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    container_name: movie-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - movie-db-data:/var/opt/mssql
      - ./movie_db:/seed:ro

volumes:
  movie-db-data: